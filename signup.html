<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign Up — TAJAJINS</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
</head>
<body>
  <main class="auth">
    <div class="authbox">
      <a class="logo" href="index.html">
        <img src="assets/images/logo.png" alt="TAJAJINS Logo" class="logo-img">
      </a>
      <div class="eyebrow" style="text-align:center">TAJAJINS ACCOUNT</div>
      <h1>Join Us.</h1>
      <p>Create your free account to unlock express slot bookings and custom grocery routines.</p>
      
      <form data-demo onsubmit="event.preventDefault(); alert('Account created successfully!'); window.location.href='index.html';">
        <div class="field">
          <label>Full Name</label>
          <input type="text" placeholder="Your full name" required>
        </div>

        <div class="field">
          <label>Email Address</label>
          <input type="email" placeholder="name@example.com" required>
        </div>
        
        <div class="field" style="position:relative;">
          <label>Password</label>
          <div style="position:relative;">
            <input type="password" id="regPass" placeholder="••••••••" required style="padding-right:45px;">
            <button type="button" onclick="togglePass('regPass', this)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px;" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <div class="field" style="position:relative;">
          <label>Confirm Password</label>
          <div style="position:relative;">
            <input type="password" id="confirmPass" placeholder="••••••••" required style="padding-right:45px;">
            <button type="button" onclick="togglePass('confirmPass', this)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px;" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <div style="margin:16px 0 24px; font-size:14px;">
          <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer; font-family:var(--body);">
            <input type="checkbox" required style="accent-color:var(--green); width:18px; height:18px; margin-top:2px;">
            <span>I agree to the <a href="#" onclick="alert('Terms & Conditions displayed.'); return false;" style="color:var(--orange); font-weight:700;">Terms & Conditions</a> and <a href="#" onclick="alert('Privacy Policy displayed.'); return false;" style="color:var(--orange); font-weight:700;">Privacy Policy</a></span>
          </label>
        </div>

        <button class="btn primary" style="width:100%">Create Account</button>
      </form>
      
      <div class="note">
        Already have an account? <a href="login.html" style="font-weight:700;">Sign in</a>
      </div>
    </div>
  </main>

  <script>
    function togglePass(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }
  </script>
  <script src="assets/js/main.js"></script>
</body>
</html>
