<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — TAJAJINS</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
</head>
<body>
  <main class="auth">
    <div class="authbox">
      <a class="logo" href="index.html">
        <img src="assets/images/logo.png" alt="TAJAJINS Logo" class="logo-img">
      </a>
      <div class="eyebrow" style="text-align:center">TAJAJINS ACCOUNT</div>
      <h1>Welcome.</h1>
      <p>Sign in to manage your saved lists, delivery addresses, and active routines.</p>
      
      <form data-demo onsubmit="event.preventDefault(); alert('Signed in successfully!'); window.location.href='index.html';">
        <div class="field">
          <label>Email Address</label>
          <input type="email" placeholder="name@example.com" required>
        </div>
        
        <div class="field" style="position:relative;">
          <label>Password</label>
          <div style="position:relative;">
            <input type="password" id="loginPass" placeholder="••••••••" required style="padding-right:45px;">
            <button type="button" onclick="togglePass('loginPass', this)" class="pass-toggle" title="Toggle password visibility"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></button>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0 24px; font-size:14px;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-family:var(--body);">
            <input type="checkbox" style="accent-color:var(--green); width:18px; height:18px;"> Remember me
          </label>
          <a href="#" onclick="alert('Password reset link sent to your email.'); return false;" style="color:var(--orange); font-weight:700;">Forgot Password?</a>
        </div>

        <button class="btn primary" style="width:100%">Sign In</button>
      </form>
      
      <div class="note">
        New to TAJAJINS? <a href="signup.html" style="font-weight:700;">Create an account</a>
      </div>
    </div>
  </main>

  <script>
    const eyeOpen = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>';
    const eyeClosed = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>';
    function togglePass(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = eyeClosed;
      } else {
        input.type = 'password';
        btn.innerHTML = eyeOpen;
      }
    }
  </script>
  <script src="assets/js/main.js"></script>
</body>
</html>
